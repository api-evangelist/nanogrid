name: Nanogrid
description: >-
  Nanogrid was an Oakland, California software startup founded in 2017 by Patrick
  Sheehan (CEO), Jon McKay (Co-Founder & CPO), and Dan Lopuch (Co-Founder & CTO)
  that built software to determine the value of residential solar, battery
  storage, and electric vehicles for homeowners. Its platform simulated,
  estimated, and optimized these distributed energy resources and captured the
  operational synergies between the devices. A 500 Startups (500 Global) Batch 25
  company, Nanogrid raised roughly $150K from 500 Global and Plug and Play Tech
  Center before being acquired by clean-energy company Arcadia on April 22, 2021.
  The company no longer operates independently and its nanogrid.tech domain no
  longer resolves; this profile is retained in the API Evangelist network as a
  historical portfolio-lead record. (Not to be confused with the separate
  nanoGrid energy-data platform at nanogrid.com.)
